<!DOCTYPE html>
<html lang="en">
<head>
    <title> Exp 2 - Types of Cascading Style Sheets </title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <style>
        .int-css {
            margin: auto;
            background-color: black;
            padding: 40px;
            color: white;
        }

        .int-css a {
            background-color: white;
            text-decoration: none;
            padding: 20px;
            color: orange;
        }
    </style>
</head>
<body>
    <h1 style="color: red;"> This is a 'h1' tag with in-line CSS </h1>
    <p> The body tag for this page is linked to an external CSS file. Path: 'assets/css/styles.css'</p>
    <p class="int-css">
        This block uses internal CSS (Embedded CSS) - 
        <a target="_blank" href="https://github.com/vezz-z"> Click here to view my GitHub profile. </a>
    </p>
</body>
</html>
