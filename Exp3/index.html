<!DOCTYPE html>
<html lang="en">
<head>
    <title> Exp 3 - DHTML </title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body>
    <h1> Experiment 3 - Dynamic Hypertext Markup Language (DHTML) </h1>
    <form>

        <label class="input-label" for="name"> Name: </label class="input-label">
        <input class="input-field" type="text" name="name" placeholder="Enter Name">

        <label class="input-label" for="mail"> E-mail: </label class="input-label">
        <input class="input-field" type="email" name="email" placeholder="Enter E-mail">

        <label class="input-label" for="username"> Username: </label class="input-label">
        <input class="input-field" type="text" name="username" placeholder="Enter Username">

        <label class="input-label" for="password"> Password: </label class="input-label">
        <input class="input-field" type="password" name="password" placeholder="Enter Password">

        <button type="submit" disabled style="cursor: not-allowed; margin: 15px; font-size: 18px;"> Submit </button>
        
    </form>
</body>
</html>
